[SERVICE]
  Flush        5
  Daemon       Off
  Log_Level    info
  storage.path /var/fluent-bit/buffer
  storage.sync normal
  storage.checksum off
  storage.max_chunks_up 128

[INPUT]
  name                  tail
  tag                   scadalts
  refresh_interval      5
  path                  /var/log/scadalts/localhost_access_log*.txt
  read_from_head        true

[INPUT]
  name                  tail
  tag                   epanet
  refresh_interval      5
  path                  /var/log/epanet/epanet.log
  read_from_head        true

[INPUT]
  name                  tail
  tag                   mqtt
  refresh_interval      5
  path                  /var/log/mqtt/mosquitto.log
  read_from_head        true

[INPUT]
  name                  forward
  listen                0.0.0.0
  port                  24224

[INPUT]
  name                  tail
  tag                   network
  path                  /var/log/zeek/modbus.log
  refresh_interval      5
  read_from_head        false

[FILTER]
  name                  modify
  match                 scadalts
  Add                   service scadalts

[FILTER]
  name                  modify
  match                 epanet
  Add                   service epanet

[FILTER]
  name                  modify
  match                 mqtt
  Add                   service mqtt

[FILTER]
  name                  modify
  match                 openplc.*
  Add                   service openplc

[FILTER]
  name                  grep
  match                 network
  Regex                 log "pdu_type":"REQ"

[FILTER]
  name   grep
  match  network
  Regex  log "func":"WRITE_(SINGLE_COIL|MULTIPLE_COILS)"

[FILTER]
  name    grep
  match   network
  Exclude log "id.orig_h":"172.21.0.10"

[FILTER]
  name    grep
  match   network
  Exclude log "id.orig_h":"172.21.0.8"

[FILTER]
  name   modify
  match  network
  Add    service network

[OUTPUT]
  Name http
  Match scadalts
  Host data-prepper
  Port 2021
  URI /log/ingest
  Format json
  HTTP_User admin
  HTTP_Passwd admin
  net.keepalive on
  Retry_Limit False

[OUTPUT]
  Name http
  Match epanet
  Host data-prepper
  Port 2022
  URI /log/epanet
  Format json
  HTTP_User admin
  HTTP_Passwd admin
  net.keepalive on
  Retry_Limit False

[OUTPUT]
  Name http
  Match mqtt
  Host data-prepper
  Port 2023
  URI /log/mqtt
  Format json
  HTTP_User admin
  HTTP_Passwd admin
  net.keepalive on
  Retry_Limit False

[OUTPUT]
  Name http
  Match openplc.*
  Host data-prepper
  Port 2024
  URI /log/openplc
  Format json
  HTTP_User admin
  HTTP_Passwd admin
  net.keepalive on
  Retry_Limit False

[OUTPUT]
  Name http
  Match network
  Host data-prepper
  Port 2026
  URI /log/network
  Format json
  HTTP_User admin
  HTTP_Passwd admin
  net.keepalive on
  Retry_Limit False